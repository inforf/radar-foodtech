<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <meta name="theme-color" content="#151515">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Radar Foodtech — início">
          <span class="brand-mark" aria-hidden="true">RF</span>
          <span>Radar <strong>Foodtech</strong></span>
        </a>
        <nav aria-label="Navegação principal">
          <a href="{{ '/' | relative_url }}">Início</a>
          <a href="{{ '/sobre/' | relative_url }}">Sobre</a>
          <a class="nav-cta" href="https://www.linkedin.com/in/ronaldo-ferreira-qa" target="_blank" rel="noopener">LinkedIn</a>
        </nav>
      </div>
    </header>

    <main id="conteudo">{{ content }}</main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div>
          <a class="brand brand-footer" href="{{ '/' | relative_url }}">
            <span class="brand-mark" aria-hidden="true">RF</span>
            <span>Radar <strong>Foodtech</strong></span>
          </a>
          <p>Tecnologia analisada pelo que entrega na operação real.</p>
        </div>
        <div class="footer-links">
          <a href="{{ '/sobre/' | relative_url }}">Sobre</a>
          <a href="{{ '/privacidade/' | relative_url }}">Privacidade</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
          <a href="https://inforf.github.io" target="_blank" rel="noopener">Portfólio de QA</a>
        </div>
      </div>
      <div class="container footer-bottom">
        <span>© {{ site.time | date: '%Y' }} Ronaldo Ferreira</span>
        <span>Publicado com GitHub Pages</span>
      </div>
    </footer>
  </body>
</html>
