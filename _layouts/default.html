<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <meta name="theme-color" content="#151515">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-src 'none'; script-src 'self' https://www.clarity.ms; style-src 'self'; img-src 'self' data: https://*.clarity.ms https://*.bing.com; connect-src 'self' https://*.clarity.ms https://*.bing.com; font-src 'self'; upgrade-insecure-requests">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:locale" content="pt_BR">
    {% if page.image %}
    <meta property="og:image" content="{{ page.image | absolute_url }}">
    <meta property="og:image:secure_url" content="{{ page.image | absolute_url }}">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="627">
    <meta property="og:image:alt" content="{{ page.image_alt | default: page.title | escape }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <meta name="twitter:image" content="{{ page.image | absolute_url }}">
    <meta name="twitter:image:alt" content="{{ page.image_alt | default: page.title | escape }}">
    {% endif %}
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/global.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    {% include header.html %}

    <main id="conteudo">{{ content }}</main>

    {% include footer.html %}
    {% include privacy-controls.html %}
  </body>
</html>
