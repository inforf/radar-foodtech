  <text x="128" y="81" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#171717">Radar <tspan fill="#ef4b23">Foodtech</tspan></text>
  <text x="65" y="151" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#b92e10">OPERAÇÃO SOB TESTE</text>
  <text x="65" y="243" font-family="DejaVu Serif,Georgia,serif" font-size="52" fill="#171717">O pedido foi feito.</text>
  <text x="65" y="320" font-family="DejaVu Serif,Georgia,serif" font-size="52" fill="#171717">E se a confirmação</text>
  <text x="65" y="397" font-family="DejaVu Serif,Georgia,serif" font-size="52" fill="#ef4b23">não chegar?</text>
  <path d="M68 438h112" stroke="#ef4b23" stroke-width="6" stroke-linecap="round"/>
  <text x="65" y="516" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#6c665e">O que acontece quando a conexão falha no meio do pedido.</text>
  <text x="65" y="596" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#171717">TECNOLOGIA  /  OPERAÇÃO  /  QUALIDADE</text>
  <text x="1114" y="596" text-anchor="end" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#b92e10">EDIÇÃO 02</text>
