<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">O pedido foi feito. E se a confirmação não chegar?</title>
  <desc id="desc">Capa editorial creme, preta e laranja com um pedido em uma tela e um ponto de interrogação na confirmação.</desc>
  <defs>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".45" fill="#171717" opacity=".10"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#171717" flood-opacity=".15"/></filter>
  </defs>
  <rect width="1200" height="627" fill="#f7f1e7"/>
  <rect width="1200" height="627" fill="url(#grain)" opacity=".65"/>
  <path d="M0 557H1200" stroke="#171717" stroke-opacity=".25"/>
